# GitHub Actions —— 自动构建并推送 Docker 镜像（ghcr.io）
#
# 触发时机：
#   - 推送到 main        → 构建并推送 ghcr.io/<owner>/jia:main / latest / sha-xxxx
#   - 推送 v* 版本标签    → 构建并推送 ghcr.io/<owner>/jia:v1.2.3 / latest
#   - 提 PR 到 main      → 只构建不推送（用于验证 Dockerfile，产出 pr-N / sha-xxxx）
#   - 手动触发（workflow_dispatch）
#
# 拉取使用：
#   docker pull ghcr.io/zhangmiaochen/jia:latest
#   docker run -d --name jia -p 8081:80 -v jia-data:/data -e JIA_JWT_SECRET=... ghcr.io/zhangmiaochen/jia:latest
# 注：GHCR 包默认私有，需在仓库 Settings → Packages 里设为 Public（或先 docker login ghcr.io）。

name: Docker CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR 只验证构建，不登录、不推送
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action 会自动将镜像名转小写（zhangmiaochen/Jia → zhangmiaochen/jia）
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # 多架构：arm64 由 QEMU 模拟，构建较慢；只需 x86 时可删除 arm64
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
